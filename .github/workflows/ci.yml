name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync
        run: uv sync --all-extras --dev
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Types
        run: uv run ty check
      - name: Test
        run: uv run pytest
        env:
          HYPOTHESIS_PROFILE: ci
      - name: Build
        run: uv build
