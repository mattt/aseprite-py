[project]
name = "aseprite"
version = "0.1.0"
description = "Read and write Aseprite .ase/.aseprite files"
readme = "README.md"
authors = [
    { name = "Mattt", email = "mattt@me.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["aseprite", "ase", "pixel-art", "sprites"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mattt/aseprite-py"
Repository = "https://github.com/mattt/aseprite-py"
Issues = "https://github.com/mattt/aseprite-py/issues"

[project.optional-dependencies]
image = [
    "pillow>=10.1",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.167.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[tool.ruff]
src = ["src", "."]
target-version = "py312"
line-length = 88
# Honor exclusions for files opened directly in an editor, too.
force-exclude = true
# Generated output and Python interpreter sources are not project code.
extend-exclude = ["build", "python3.[0-9]*", "Lib"]

[tool.ruff.lint]
# Keep rule selection here so editors and CI enforce the same conventions.
select = ["E", "F", "I", "UP", "B", "S"]
# The formatter handles wrapping where it can; prose and URLs may run longer.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["aseprite"]

[tool.ty.environment]
root = ["./src"]
extra-paths = ["."]

[tool.ty.src]
include = ["src", "tests", "examples"]
# These scripts use the local package and belong in the normal checks.
exclude-scripts = false
